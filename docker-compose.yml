# 기본 구성 (Mac 개발용, CPU).
# LLM은 컨테이너 밖에서 llama.cpp(Metal)로 띄우고 host.docker.internal:8080 으로 접속한다 (make llm-mac).
# EC2 GPU 구성은 docker-compose.gpu.yml 을 겹쳐서 쓴다 (make gpu-up).
name: mmio

x-common-env: &common-env
  REDIS_URL: redis://redis:6379/0

services:
  redis:
    image: redis:7.2-alpine # 7.2는 BSD-3 라이선스 마지막 버전, BLMOVE(6.2+) 지원
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  cv-worker:
    build:
      context: .
      dockerfile: workers/cv/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      CV_MODEL_DIR: /models
    volumes:
      - ./models:/models # 가중치를 호스트에 캐시 (없으면 첫 실행 때 내려받음)
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 워커 루프가 1초마다 갱신하는 파일. 15초 넘게 안 바뀌면 루프가 멈춘 것
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/cv-worker-heartbeat') < 15 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped
