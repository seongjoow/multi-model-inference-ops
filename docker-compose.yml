# 기본 구성 (Mac 개발용, CPU).
# LLM은 컨테이너 밖에서 llama.cpp(Metal)로 띄우고 host.docker.internal:8080 으로 접속한다 (make llm-mac).
# EC2 GPU 구성은 docker-compose.gpu.yml 을 겹쳐서 쓴다 (make gpu-up).
name: mmio

x-common-env: &common-env
  REDIS_URL: redis://redis:6379/0

services:
  redis:
    image: redis:7.2-alpine # 7.2는 BSD-3 라이선스 마지막 버전, BLMOVE(6.2+) 지원
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
    ports: ["127.0.0.1:8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  cv-worker:
    build:
      context: .
      dockerfile: workers/cv/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      CV_MODEL_DIR: /models
    volumes:
      - ./models:/models # 가중치를 호스트에 캐시 (없으면 첫 실행 때 내려받음)
    deploy:
      replicas: ${CV_WORKERS:-1} # 워커 수 (.env). 2면 해독·추론을 두 프로세스가 나눠 함
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 워커 루프가 1초마다 갱신하는 파일. 15초 넘게 안 바뀌면 루프가 멈춘 것
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/cv-worker-heartbeat') < 15 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ---- 관측: 각 서비스의 /metrics 를 2초마다 모아(Prometheus) 그래프로 보여줌(Grafana)
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro # 경보 규칙 (Prometheus > Alerts)
      - ./monitoring/prometheus/scrape/llm-mac.yml:/etc/prometheus/scrape/llm.yml:ro # EC2에선 gpu.yml이 교체
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.13
    environment:
      # 127.0.0.1 에만 열리므로 로그인 없이 바로 대시보드로 (EC2는 SSH 터널로 접속)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/inference-ops.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

  # ---- 부하 생성기: 평소엔 안 뜨고 make load-* 로 한 번씩 실행 (profiles)
  loadgen:
    build:
      context: .
      dockerfile: loadgen/Dockerfile
    profiles: ["tools"]
    user: "1000:1000"
    environment:
      GATEWAY_URL: http://gateway:8000
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
      - ./.env:/app/.env:ro

volumes:
  prometheus-data:
